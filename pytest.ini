[pytest]
markers =
    chaos: chaos/stress scenario
    weekly: run only in weekly pipelines unless KEEPER_RUN_WEEKLY=1
    network: network-related chaos (tc, partitions)
    disk: disk-related chaos (dmsetup, enospc, volume detach)
    tls: TLS-related scenarios
    backend_default: run with default Keeper backend
    backend_rocks: run with RocksKeeper backend
    slow: long-running scenarios
